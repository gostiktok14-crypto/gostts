name: Build Demux worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.export"
      - "runpod-worker-export/**"
      - ".github/workflows/build-demux-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run worker unit tests
        run: python -m unittest discover -s runpod-worker-export -p "test_*.py" -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.export
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/worudub-demux:v1.1.4
            ghcr.io/${{ github.repository_owner }}/worudub-demux:latest
